        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const editorSection = document.getElementById('editor-section');
        const previewContainer = document.getElementById('preview-container');
        const videoElement = document.getElementById('video-element');
        const cropBox = document.getElementById('crop-box');
        const zoomSlider = document.getElementById('zoom-slider');
        // Timeline references
        const timelineContainer = document.getElementById('trim-timeline-container');
        const timelineScrollViewport = document.getElementById('timeline-scroll-viewport');
        const timelineTrack = document.getElementById('timeline-track');
        const timeRuler = document.getElementById('time-ruler');
        const filmstrip = document.getElementById('filmstrip');
        const dimOverlays = document.getElementById('dim-overlays');
        const segmentsContainer = document.getElementById('segments-container');
        const playhead = document.getElementById('playhead');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const zoomLevelLabel = document.getElementById('zoom-level-label');
        const btnFramePrev = document.getElementById('btn-frame-prev');
        const btnPlaySelection = document.getElementById('btn-play-selection');
        const btnFrameNext = document.getElementById('btn-frame-next');
        const btnSplit = document.getElementById('btn-split');
        const btnDeleteSegment = document.getElementById('btn-delete-segment');
        const resultSection = document.getElementById('result-section');
        const publishingSection = document.getElementById('publishing-section');
        const publishingTitleInput = document.getElementById('publishing-title');
        const publishingTopTitlesGroup = document.getElementById('publishing-top-titles-group');
        const publishingTopTitlesList = document.getElementById('publishing-top-titles-list');
        const publishingAllTitlesGroup = document.getElementById('publishing-all-titles-group');
        const publishingAllTitlesList = document.getElementById('publishing-all-titles-list');
        const publishingDescription = document.getElementById('publishing-description');
        const btnCopyTitle = document.getElementById('btn-copy-title');
        const btnCopyDescription = document.getElementById('btn-copy-description');
        let currentSelectedTitle = '';

        let currentMode = 'curiosity';
        document.getElementById('mode-curiosity').onclick = (e) => {
            currentMode = 'curiosity';
            e.target.classList.add('active');
            document.getElementById('mode-main').classList.remove('active');
            document.getElementById('curiosity-fields').style.display = 'block';

        };
        document.getElementById('mode-main').onclick = (e) => {
            currentMode = 'main';
            e.target.classList.add('active');
            document.getElementById('mode-curiosity').classList.remove('active');
            document.getElementById('curiosity-fields').style.display = 'none';

        };

        let enhanceEnabled = false;
        let audioMode = 'enhanced';

        const enhanceToggle = document.getElementById('enhance-toggle');
        const audioModeGroup = document.getElementById('audio-mode-group');
        const audioModeToggle = document.getElementById('audio-mode-toggle');

        enhanceToggle.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.onclick = () => {
                enhanceToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                enhanceEnabled = (btn.dataset.val === 'on');
                audioModeGroup.style.display = enhanceEnabled ? 'block' : 'none';
            };
        });

        audioModeToggle.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.onclick = () => {
                audioModeToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                audioMode = btn.dataset.val;
            };
        });

        let brandingEnabled = false;
        const brandingToggle = document.getElementById('branding-toggle');
        brandingToggle.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.onclick = () => {
                brandingToggle.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                brandingEnabled = (btn.dataset.val === 'on');
            };
        });


        // Gemini Caption Writer Logic
        const geminiContext = document.getElementById('gemini-context');
        const btnGeminiGenerate = document.getElementById('btn-gemini-generate');
        const geminiError = document.getElementById('gemini-error');
        const geminiResultCard = document.getElementById('gemini-result-card');
        const geminiPreviewMain = document.getElementById('gemini-preview-main');
        const geminiPreviewCuriosity = document.getElementById('gemini-preview-curiosity');
        const geminiPreviewMainEmoji = document.getElementById('gemini-preview-main-emoji');
        const geminiPreviewCuriosityEmoji = document.getElementById('gemini-preview-curiosity-emoji');
        const geminiOptionsContainer = document.getElementById('gemini-options-container');
        const geminiOptionsPills = document.getElementById('gemini-options-pills');
        const btnGeminiRetry = document.getElementById('btn-gemini-retry');
        const btnGeminiUse = document.getElementById('btn-gemini-use');

        let recentGenerations = [];
        let currentGeneratedPair = null;
        let selectedCaptionIndex = 0;

        function updateCaptionPreview(idx) {
            if (!currentGeneratedPair) return;
            selectedCaptionIndex = idx;
            const captions = currentGeneratedPair.captions || [];
            const opt = (captions.length > idx) ? captions[idx] : currentGeneratedPair;

            const mainText = opt.main || opt.main_caption || '';
            const mainEmoji = opt.main_emoji || '';
            const curiosityText = opt.curiosity || opt.curiosity_caption || '';
            const curiosityEmoji = opt.curiosity_emoji || '';

            if (geminiPreviewMain) geminiPreviewMain.innerText = mainText;
            if (geminiPreviewMainEmoji) geminiPreviewMainEmoji.innerText = mainEmoji;
            if (geminiPreviewCuriosity) geminiPreviewCuriosity.innerText = curiosityText;
            if (geminiPreviewCuriosityEmoji) geminiPreviewCuriosityEmoji.innerText = curiosityEmoji;

            if (geminiOptionsPills) {
                const pills = geminiOptionsPills.querySelectorAll('.toggle-btn');
                pills.forEach((p, pIdx) => {
                    if (pIdx === idx) {
                        p.classList.add('active');
                        p.style.background = '#4f46e5';
                        p.style.color = '#ffffff';
                        p.style.borderColor = '#4f46e5';
                    } else {
                        p.classList.remove('active');
                        p.style.background = '#f1f5f9';
                        p.style.color = 'var(--text-main)';
                        p.style.borderColor = 'var(--border-color)';
                    }
                });
            }
        }

        function populateCaptionOptions(captions) {
            if (!geminiOptionsPills || !geminiOptionsContainer) return;
            geminiOptionsPills.innerHTML = '';
            if (!captions || captions.length <= 1) {
                geminiOptionsContainer.style.display = 'none';
                return;
            }
            geminiOptionsContainer.style.display = 'block';
            captions.forEach((cap, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'toggle-btn' + (idx === selectedCaptionIndex ? ' active' : '');
                btn.style.padding = '6px 12px';
                btn.style.fontSize = '12px';
                btn.style.whiteSpace = 'nowrap';
                btn.style.borderRadius = '6px';
                const emojiIcon = cap.main_emoji || cap.curiosity_emoji || '';
                btn.innerText = `Caption ${idx + 1}${emojiIcon ? ' ' + emojiIcon : ''}`;
                btn.onclick = () => updateCaptionPreview(idx);
                geminiOptionsPills.appendChild(btn);
            });
        }

        async function requestGeminiCaptions() {
            const contextText = geminiContext.value.trim();
            if (!contextText) {
                geminiError.innerText = "Please describe what is happening in the video first.";
                geminiError.style.display = "block";
                return;
            }

            btnGeminiGenerate.disabled = true;
            btnGeminiRetry.disabled = true;
            btnGeminiGenerate.innerText = "✨ Generating...";
            geminiError.style.display = "none";
            geminiError.innerText = "";

            try {
                const res = await fetch('/api/generate_captions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        context: contextText,
                        previous_generations: recentGenerations
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || "Failed to generate captions");
                }

                currentGeneratedPair = data;
                recentGenerations.push({
                    main_caption: data.main_caption || data.main || "",
                    curiosity_caption: data.curiosity_caption || data.curiosity || "",
                    main: data.main || data.main_caption || "",
                    curiosity: data.curiosity || data.curiosity_caption || ""
                });

                selectedCaptionIndex = 0;
                populateCaptionOptions(data.captions);
                updateCaptionPreview(0);

                const providerBadge = document.getElementById('gemini-provider-badge');
                if (providerBadge) {
                    if (data.provider) {
                        const pName = data.provider.charAt(0).toUpperCase() + data.provider.slice(1);
                        providerBadge.innerText = `via ${pName}`;
                    } else {
                        providerBadge.innerText = '';
                    }
                }

                geminiResultCard.style.display = "block";

                // If video is already rendered below, populate and reveal publishing section immediately
                if (resultSection && resultSection.style.display === "block") {
                    populatePublishingSection(data);
                }
            } catch (err) {
                geminiError.innerText = err.message || "AI generation is temporarily unavailable. Please try again in a moment.";
                geminiError.style.display = "block";
            } finally {
                btnGeminiGenerate.disabled = false;
                btnGeminiRetry.disabled = false;
                btnGeminiGenerate.innerText = "✨ Generate";
            }
        }

        btnGeminiGenerate.onclick = requestGeminiCaptions;
        btnGeminiRetry.onclick = requestGeminiCaptions;

        btnGeminiUse.onclick = () => {
            if (!currentGeneratedPair) return;
            const captions = currentGeneratedPair.captions || [];
            const opt = (captions.length > selectedCaptionIndex) ? captions[selectedCaptionIndex] : currentGeneratedPair;

            const mainText = opt.main || opt.main_caption || '';
            const mainEmoji = opt.main_emoji || '';
            const curiosityText = opt.curiosity || opt.curiosity_caption || '';
            const curiosityEmoji = opt.curiosity_emoji || '';

            const captionMainInput = document.getElementById('caption-main');
            const captionEmojiMainInput = document.getElementById('caption-emoji-main');
            const captionCuriosityInput = document.getElementById('caption-curiosity');
            const captionEmojiCuriosityInput = document.getElementById('caption-emoji-curiosity');

            if (captionMainInput) {
                captionMainInput.value = mainText;
                captionMainInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            if (captionEmojiMainInput) {
                captionEmojiMainInput.value = mainEmoji;
                captionEmojiMainInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            if (captionCuriosityInput) {
                captionCuriosityInput.value = curiosityText;
                captionCuriosityInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            if (captionEmojiCuriosityInput) {
                captionEmojiCuriosityInput.value = curiosityEmoji;
                captionEmojiCuriosityInput.dispatchEvent(new Event('input', { bubbles: true }));
            }

            const origText = btnGeminiUse.innerText;
            btnGeminiUse.innerText = "✓ Applied!";
            setTimeout(() => {
                btnGeminiUse.innerText = origText;
            }, 1500);

            if (captionMainInput) {
                captionMainInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        };

        // Publishing Section Logic (Title & Description below Video)
        function populatePublishingSection(pkg) {
            if (!pkg) return;
            const titles = Array.isArray(pkg.titles) ? pkg.titles : [];
            const topTitles = Array.isArray(pkg.top_titles) ? pkg.top_titles : [];
            const desc = typeof pkg.description === 'string' ? pkg.description : '';

            if (titles.length === 0 && !desc) {
                if (publishingSection) publishingSection.style.display = 'none';
                return;
            }

            if (!currentSelectedTitle) {
                if (topTitles.length > 0) {
                    currentSelectedTitle = topTitles[0];
                } else if (titles.length > 0) {
                    currentSelectedTitle = titles[0];
                }
            }

            if (publishingTitleInput && !publishingTitleInput.value) {
                publishingTitleInput.value = currentSelectedTitle;
            }

            if (publishingDescription && !publishingDescription.value) {
                let initialDesc = desc;
                if (currentSelectedTitle && !initialDesc.startsWith(currentSelectedTitle)) {
                    const matchingTitle = titles.find(t => t && initialDesc.startsWith(t.trim()));
                    if (matchingTitle) {
                        currentSelectedTitle = matchingTitle;
                        if (publishingTitleInput) publishingTitleInput.value = matchingTitle;
                    } else {
                        initialDesc = currentSelectedTitle + (initialDesc ? "\\n\\n" + initialDesc : "");
                    }
                }
                publishingDescription.value = initialDesc;
            }

            // Render Recommended Titles
            if (publishingTopTitlesList) {
                publishingTopTitlesList.innerHTML = '';
                topTitles.forEach(title => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'title-option-btn' + (title === currentSelectedTitle ? ' active' : '');
                    btn.dataset.title = title;
                    btn.innerHTML = `<span style="display:inline-block; margin-right:6px; font-size:10px; font-weight:700; color:#ef4444; background:#fee2e2; padding:2px 6px; border-radius:4px; text-transform:uppercase;">Recommended</span> ${title}`;
                    btn.onclick = () => selectTitle(title);
                    publishingTopTitlesList.appendChild(btn);
                });
            }

            // Render Other Titles
            if (publishingAllTitlesList) {
                publishingAllTitlesList.innerHTML = '';
                titles.forEach((title) => {
                    if (topTitles.includes(title)) return;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'title-option-btn' + (title === currentSelectedTitle ? ' active' : '');
                    btn.dataset.title = title;
                    btn.innerText = title;
                    btn.onclick = () => selectTitle(title);
                    publishingAllTitlesList.appendChild(btn);
                });
            }

            if (publishingSection) {
                publishingSection.style.display = 'block';
            }
        }

        function selectTitle(newTitle) {
            if (!newTitle) return;
            const oldTitle = currentSelectedTitle;
            currentSelectedTitle = newTitle;

            if (publishingTitleInput) {
                publishingTitleInput.value = newTitle;
            }

            if (publishingDescription) {
                let currentDesc = publishingDescription.value;
                if (oldTitle && currentDesc.startsWith(oldTitle)) {
                    publishingDescription.value = newTitle + currentDesc.slice(oldTitle.length);
                } else if (oldTitle && currentDesc.startsWith(oldTitle.trim())) {
                    publishingDescription.value = newTitle + currentDesc.slice(oldTitle.trim().length);
                } else {
                    const allTitles = (currentGeneratedPair && Array.isArray(currentGeneratedPair.titles)) ? currentGeneratedPair.titles : [];
                    const found = allTitles.find(t => t && currentDesc.startsWith(t.trim()));
                    if (found) {
                        publishingDescription.value = newTitle + currentDesc.slice(found.trim().length);
                    }
                }
            }
            refreshTitlePillSelection();
        }

        function refreshTitlePillSelection() {
            const allBtns = document.querySelectorAll('.title-option-btn');
            allBtns.forEach(btn => {
                const btnTitle = btn.dataset.title;
                if (btnTitle === currentSelectedTitle) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        if (publishingTitleInput) {
            publishingTitleInput.oninput = () => {
                const newTitle = publishingTitleInput.value;
                if (publishingDescription && currentSelectedTitle && publishingDescription.value.startsWith(currentSelectedTitle)) {
                    publishingDescription.value = newTitle + publishingDescription.value.slice(currentSelectedTitle.length);
                }
                currentSelectedTitle = newTitle;
                refreshTitlePillSelection();
            };
        }

        function copyTextToClipboard(text, btnElement, successMsg, defaultMsg) {
            if (!text) return;
            const doFeedback = () => {
                const orig = btnElement.innerText;
                btnElement.innerText = successMsg;
                setTimeout(() => {
                    btnElement.innerText = defaultMsg || orig;
                }, 1500);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(doFeedback).catch(() => {
                    fallbackCopy(text);
                    doFeedback();
                });
            } else {
                fallbackCopy(text);
                doFeedback();
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        }

        if (btnCopyTitle) {
            btnCopyTitle.onclick = () => {
                const text = publishingTitleInput ? publishingTitleInput.value : '';
                copyTextToClipboard(text, btnCopyTitle, "✓ Copied!", "📋 Copy Title");
            };
        }

        if (btnCopyDescription) {
            btnCopyDescription.onclick = () => {
                const text = publishingDescription ? publishingDescription.value : '';
                copyTextToClipboard(text, btnCopyDescription, "✓ Copied!", "📋 Copy Description");
            };
        }

        uploadArea.onclick = () => fileInput.click();

        let origW, origH, maxCropSize, currentCropSize = 0, cropX = 0, cropY = 0;
        let isPlaying = false;
        let playbackLoopId = null;

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            const ms = Math.floor((s % 1) * 1000);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
        }



        const playIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
        const pauseIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';



        fileInput.onchange = (e) => {
            if(!e.target.files[0]) return;

            stopPlayback();

            const url = URL.createObjectURL(e.target.files[0]);
            videoElement.src = url;
            videoElement.load();

            videoElement.onloadedmetadata = () => {
                const dur = videoElement.duration;

                // Reset timeline zoom to 100% on upload
                currentZoomIndex = 0;
                applyZoom(false);

                // Initialize timeline
                segments = [{ start: 0, end: dur }];
                activeSegmentIndex = 0;
                generateFilmstrip();
                renderTimeline();
                renderTimeRuler();

                videoElement.currentTime = dur / 2;

                uploadArea.style.display = 'none';
                editorSection.style.display = 'block';
                resultSection.style.display = 'none';

                origW = videoElement.videoWidth;
                origH = videoElement.videoHeight;
                maxCropSize = Math.min(origW, origH);

                zoomSlider.value = 100;
                updateCropBoxSize();

                cropBox.style.left = ((100 - parseFloat(cropBox.style.width)) / 2) + '%';
                cropBox.style.top = Math.min(((100 - parseFloat(cropBox.style.height)) / 2), 20) + '%';
                updateCropCoords();
            };
        };

        let isSeeking = false;
        let pendingSeek = null;
        let seekTimer = null;

        function completeSeek() {
            clearTimeout(seekTimer);
            isSeeking = false;

            if (pendingSeek !== null) {
                const t = pendingSeek;
                pendingSeek = null;

                if (Math.abs(videoElement.currentTime - t) < 0.01) {
                    return;
                }

                isSeeking = true;
                videoElement.currentTime = t;
                seekTimer = setTimeout(completeSeek, 250);
            }
        }

        videoElement.addEventListener('seeked', completeSeek);

        function requestSeek(time) {
            if (Math.abs(videoElement.currentTime - time) < 0.01) {
                return;
            }
            if (!isSeeking) {
                isSeeking = true;
                videoElement.currentTime = time;
                seekTimer = setTimeout(completeSeek, 250);
            } else {
                pendingSeek = time;
            }
        }


        // --- TIMELINE LOGIC WITH REFINED TOUCH, ZOOM & FRAME CONTROLS ---
        let segments = [];
        let activeSegmentIndex = 0;

        // Timeline Zoom System
        const ZOOM_LEVELS = [100, 200, 400, 800, 1600, 3200];
        let currentZoomIndex = 0; // 100% default

        function applyZoom(preservePlayhead = true) {
            const zoomPct = ZOOM_LEVELS[currentZoomIndex];
            if (zoomLevelLabel) zoomLevelLabel.innerText = zoomPct + '%';
            if (btnZoomOut) btnZoomOut.disabled = (currentZoomIndex === 0);
            if (btnZoomIn) btnZoomIn.disabled = (currentZoomIndex === ZOOM_LEVELS.length - 1);

            const viewport = timelineScrollViewport;
            const track = timelineTrack;
            if (!viewport || !track) return;

            let curTimeFraction = 0;
            let oldScreenX = viewport.clientWidth / 2;
            if (preservePlayhead && videoElement.duration) {
                const curTime = videoElement.currentTime || (segments[activeSegmentIndex] ? segments[activeSegmentIndex].start : 0);
                curTimeFraction = Math.max(0, Math.min(1, curTime / videoElement.duration));
                const oldTrackWidth = track.getBoundingClientRect().width;
                if (oldTrackWidth > 0) {
                    const oldPlayheadPx = curTimeFraction * oldTrackWidth;
                    oldScreenX = oldPlayheadPx - viewport.scrollLeft;
                    if (oldScreenX < 20 || oldScreenX > viewport.clientWidth - 20) {
                        oldScreenX = viewport.clientWidth / 2;
                    }
                }
            }

            track.style.width = zoomPct + '%';

            renderTimeline();
            renderTimeRuler();

            if (preservePlayhead && videoElement.duration) {
                const newTrackWidth = (viewport.clientWidth * zoomPct) / 100;
                const newPlayheadPx = curTimeFraction * newTrackWidth;
                const targetScrollLeft = Math.max(0, Math.min(newTrackWidth - viewport.clientWidth, newPlayheadPx - oldScreenX));
                viewport.scrollLeft = targetScrollLeft;
            } else {
                viewport.scrollLeft = 0;
            }
        }

        if (btnZoomIn) {
            btnZoomIn.onclick = () => {
                if (currentZoomIndex < ZOOM_LEVELS.length - 1) {
                    currentZoomIndex++;
                    applyZoom(true);
                }
            };
        }

        if (btnZoomOut) {
            btnZoomOut.onclick = () => {
                if (currentZoomIndex > 0) {
                    currentZoomIndex--;
                    applyZoom(true);
                }
            };
        }

        function renderTimeRuler() {
            if (!timeRuler || !videoElement.duration) return;
            const dur = videoElement.duration;
            const track = timelineTrack;
            const viewport = timelineScrollViewport;
            if (!track || !viewport) return;

            const zoomPct = ZOOM_LEVELS[currentZoomIndex];
            const trackWidth = (viewport.clientWidth * zoomPct) / 100;
            if (trackWidth <= 0) return;
            const pxPerSec = trackWidth / dur;

            const intervals = [0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0, 15.0, 30.0, 60.0, 120.0];
            let step = 5.0;
            for (const intv of intervals) {
                if (intv * pxPerSec >= 50) {
                    step = intv;
                    break;
                }
            }

            let html = '';
            for (let t = 0; t <= dur + 1e-5; t += step) {
                const pct = (t / dur) * 100;
                let label = '';
                if (step < 0.1) {
                    label = t.toFixed(2) + 's';
                } else if (step < 1.0) {
                    label = t.toFixed(1) + 's';
                } else if (step < 60) {
                    label = Math.round(t) + 's';
                } else {
                    const m = Math.floor(t / 60);
                    const s = Math.floor(t % 60);
                    label = `${m}:${s.toString().padStart(2, '0')}`;
                }
                html += `<div style="position: absolute; left: ${pct}%; top: 0; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none;">
                    <span style="font-size: 9px; font-weight: 600; color: #94a3b8; line-height: 10px; margin-top: 2px;">${label}</span>
                    <div style="width: 1px; height: 4px; background: rgba(255, 255, 255, 0.3); margin-top: auto;"></div>
                </div>`;
            }
            timeRuler.innerHTML = html;
        }

        window.addEventListener('resize', () => {
            if (videoElement.duration) {
                renderTimeRuler();
            }
        });

        function generateFilmstrip() {
            filmstrip.innerHTML = '';
            filmstrip.style.background = '#475569';
            filmstrip.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:10px;">[ Video Track ]</div>';
        }

        function renderTimeline() {
            if (!videoElement.duration) return;
            const dur = videoElement.duration;

            dimOverlays.innerHTML = '';
            segmentsContainer.innerHTML = '';

            segments.forEach((seg, idx) => {
                const sPct = (seg.start / dur) * 100;
                const ePct = (seg.end / dur) * 100;
                const wPct = Math.max(0, ePct - sPct);

                const segEl = document.createElement('div');
                segEl.style.position = 'absolute';
                segEl.style.left = sPct + '%';
                segEl.style.width = wPct + '%';
                segEl.style.minWidth = '4px'; // Keeps tiny segments visible
                segEl.style.top = '0';
                segEl.style.bottom = '0';
                segEl.style.boxSizing = 'border-box';
                segEl.style.pointerEvents = 'auto';

                if (idx === activeSegmentIndex) {
                    segEl.style.border = '2px solid #ef4444';
                    segEl.style.background = 'rgba(239, 68, 68, 0.25)';
                } else {
                    segEl.style.border = '1px solid #94a3b8';
                    segEl.style.background = 'rgba(255, 255, 255, 0.2)';
                }
                segmentsContainer.appendChild(segEl);
            });

            // Draw dimmed areas for cut/excluded portions
            let lastEnd = 0;
            segments.forEach(seg => {
                if (seg.start > lastEnd) {
                    addDim(lastEnd, seg.start, dur);
                }
                lastEnd = seg.end;
            });
            if (lastEnd < dur) {
                addDim(lastEnd, dur, dur);
            }

            updateHandles();
            updatePlayhead(videoElement.currentTime);
        }

        function addDim(start, end, dur) {
            const dim = document.createElement('div');
            dim.style.position = 'absolute';
            dim.style.left = (start / dur * 100) + '%';
            dim.style.width = ((end - start) / dur * 100) + '%';
            dim.style.top = '0';
            dim.style.bottom = '0';
            dim.style.background = 'rgba(0, 0, 0, 0.6)';
            dim.style.pointerEvents = 'none';
            dimOverlays.appendChild(dim);
        }

        // Deterministic hit-testing for handles, segments, and tiny segments
        function hitTestTimeline(px, rectWidth, dur) {
            if (!dur || segments.length === 0) return { type: 'none' };

            // 1. Exact handle hit for active segment
            if (activeSegmentIndex >= 0 && activeSegmentIndex < segments.length) {
                const activeSeg = segments[activeSegmentIndex];
                const inPx = (activeSeg.start / dur) * rectWidth;
                const outPx = (activeSeg.end / dur) * rectWidth;
                const HANDLE_TOUCH_RADIUS = 22; // 44px effective touch target

                const prevEPx = activeSegmentIndex > 0 ? (segments[activeSegmentIndex - 1].end / dur) * rectWidth : 0;
                const nextSPx = activeSegmentIndex < segments.length - 1 ? (segments[activeSegmentIndex + 1].start / dur) * rectWidth : rectWidth;

                const inMinPx = Math.max(prevEPx, inPx - HANDLE_TOUCH_RADIUS);
                const inMaxPx = inPx + Math.min(HANDLE_TOUCH_RADIUS, (outPx - inPx) / 2);

                const outMinPx = outPx - Math.min(HANDLE_TOUCH_RADIUS, (outPx - inPx) / 2);
                const outMaxPx = Math.min(nextSPx, outPx + HANDLE_TOUCH_RADIUS);

                const isInHit = px >= inMinPx && px <= inMaxPx;
                const isOutHit = px >= outMinPx && px <= outMaxPx;

                if (isInHit && isOutHit) {
                    const distIn = Math.abs(px - inPx);
                    const distOut = Math.abs(px - outPx);
                    return { type: distIn <= distOut ? 'handle-in' : 'handle-out', index: activeSegmentIndex };
                }
                if (isInHit) {
                    return { type: 'handle-in', index: activeSegmentIndex };
                }
                if (isOutHit) {
                    return { type: 'handle-out', index: activeSegmentIndex };
                }
            }

            // 2. Exact segment body hit
            let exactHitIdx = -1;
            let closestCenterDist = Infinity;
            segments.forEach((seg, idx) => {
                const sPx = (seg.start / dur) * rectWidth;
                const ePx = (seg.end / dur) * rectWidth;
                if (px >= sPx && px <= ePx) {
                    const center = (sPx + ePx) / 2;
                    const d = Math.abs(px - center);
                    if (d < closestCenterDist) {
                        closestCenterDist = d;
                        exactHitIdx = idx;
                    }
                }
            });
            if (exactHitIdx !== -1) {
                return { type: 'segment', index: exactHitIdx };
            }

            // 3. Expanded segment touch target (especially for tiny segments)
            let bestExpandedIdx = -1;
            let minEdgeDist = Infinity;
            const EXPANDED_RADIUS = 24;
            segments.forEach((seg, idx) => {
                const sPx = (seg.start / dur) * rectWidth;
                const ePx = (seg.end / dur) * rectWidth;
                const edgeDist = Math.max(0, sPx - px, px - ePx);
                if (edgeDist <= EXPANDED_RADIUS && edgeDist < minEdgeDist) {
                    minEdgeDist = edgeDist;
                    bestExpandedIdx = idx;
                }
            });
            if (bestExpandedIdx !== -1) {
                return { type: 'segment', index: bestExpandedIdx };
            }

            // 4. Narrow gap between segments -> nearest segment wins
            let nearestIdx = -1;
            let minGapDist = Infinity;
            segments.forEach((seg, idx) => {
                const sPx = (seg.start / dur) * rectWidth;
                const ePx = (seg.end / dur) * rectWidth;
                const d = Math.min(Math.abs(px - sPx), Math.abs(px - ePx));
                if (d < minGapDist) {
                    minGapDist = d;
                    nearestIdx = idx;
                }
            });
            if (minGapDist <= 32 && nearestIdx !== -1) {
                return { type: 'segment', index: nearestIdx };
            }

            // 5. Far from segments -> Playhead scrub
            return { type: 'playhead', index: -1 };
        }

        let activeHandle = null; // 'in', 'out', 'segment', or 'playhead'
        let dragSegStartX = 0;
        let dragSegOriginalStart = 0;
        let dragSegOriginalEnd = 0;

        function onTimelinePointerDown(e) {
            if (!videoElement.duration || segments.length === 0) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = timelineContainer.getBoundingClientRect();
            const px = Math.max(0, Math.min(rect.width, cx - rect.left));
            const dur = videoElement.duration;
            const t = (px / rect.width) * dur;

            const hit = hitTestTimeline(px, rect.width, dur);

            if (hit.type === 'handle-in') {
                activeHandle = 'in';
                requestSeek(segments[activeSegmentIndex].start);
                updatePlayhead(segments[activeSegmentIndex].start);
            } else if (hit.type === 'handle-out') {
                activeHandle = 'out';
                requestSeek(segments[activeSegmentIndex].end);
                updatePlayhead(segments[activeSegmentIndex].end);
            } else if (hit.type === 'segment') {
                if (activeSegmentIndex !== hit.index) {
                    activeSegmentIndex = hit.index;
                    renderTimeline();
                }
                activeHandle = 'segment';
                dragSegStartX = cx;
                dragSegOriginalStart = segments[activeSegmentIndex].start;
                dragSegOriginalEnd = segments[activeSegmentIndex].end;
                requestSeek(segments[activeSegmentIndex].start);
                updatePlayhead(segments[activeSegmentIndex].start);
            } else {
                activeHandle = 'playhead';
                requestSeek(t);
                updatePlayhead(t);
            }

            if (e.cancelable) e.preventDefault();
        }

        timelineContainer.addEventListener('pointerdown', onTimelinePointerDown);
        timelineContainer.addEventListener('mousedown', onTimelinePointerDown);
        timelineContainer.addEventListener('touchstart', onTimelinePointerDown, { passive: false });

        function handleTimelineDrag(e) {
            if (!activeHandle || !videoElement.duration || segments.length === 0) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = timelineContainer.getBoundingClientRect();
            let pct = (cx - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            const t = pct * videoElement.duration;

            // Auto-scroll when dragging near viewport edges
            if (timelineScrollViewport) {
                const vpRect = timelineScrollViewport.getBoundingClientRect();
                if (cx < vpRect.left + 35) {
                    timelineScrollViewport.scrollLeft -= 10;
                } else if (cx > vpRect.right - 35) {
                    timelineScrollViewport.scrollLeft += 10;
                }
            }

            const seg = segments[activeSegmentIndex];
            if (!seg) return;

            if (activeHandle === 'in') {
                // Stretch Start (IN handle)
                const prevEnd = activeSegmentIndex > 0 ? segments[activeSegmentIndex - 1].end : 0;
                seg.start = Math.max(prevEnd, Math.min(t, seg.end - 0.05));
                renderTimeline();
                requestSeek(seg.start);
                updatePlayhead(seg.start);
                if (e.cancelable) e.preventDefault();
            } else if (activeHandle === 'out') {
                // Stretch End (OUT handle)
                const nextStart = activeSegmentIndex < segments.length - 1 ? segments[activeSegmentIndex + 1].start : videoElement.duration;
                seg.end = Math.min(nextStart, Math.max(t, seg.start + 0.05));
                renderTimeline();
                requestSeek(seg.end);
                updatePlayhead(seg.end);
                if (e.cancelable) e.preventDefault();
            } else if (activeHandle === 'segment') {
                // Move entire segment, preserving duration
                const dx = (cx - dragSegStartX) / rect.width * videoElement.duration;
                let newStart = dragSegOriginalStart + dx;
                let newEnd = dragSegOriginalEnd + dx;
                const dur = newEnd - newStart;

                const prevEnd = activeSegmentIndex > 0 ? segments[activeSegmentIndex - 1].end : 0;
                const nextStart = activeSegmentIndex < segments.length - 1 ? segments[activeSegmentIndex + 1].start : videoElement.duration;

                if (newStart < prevEnd) {
                    newStart = prevEnd;
                    newEnd = newStart + dur;
                }
                if (newEnd > nextStart) {
                    newEnd = nextStart;
                    newStart = newEnd - dur;
                    if (newStart < prevEnd) newStart = prevEnd;
                }

                seg.start = newStart;
                seg.end = newEnd;
                renderTimeline();
                requestSeek(seg.start);
                updatePlayhead(seg.start);
                if (e.cancelable) e.preventDefault();
            } else if (activeHandle === 'playhead') {
                requestSeek(t);
                updatePlayhead(t);
                if (e.cancelable) e.preventDefault();
            }
        }

        window.addEventListener('pointermove', handleTimelineDrag);
        window.addEventListener('pointerup', () => { activeHandle = null; });
        window.addEventListener('pointercancel', () => { activeHandle = null; });
        window.addEventListener('mousemove', handleTimelineDrag);
        window.addEventListener('touchmove', handleTimelineDrag, { passive: false });
        window.addEventListener('mouseup', () => { activeHandle = null; });
        window.addEventListener('touchend', () => { activeHandle = null; });

        function updateHandles() {
            if (!videoElement.duration || segments.length === 0) return;
            const seg = segments[activeSegmentIndex];
            const inEl = document.getElementById('handle-in');
            const outEl = document.getElementById('handle-out');
            if (!inEl || !outEl || !seg) return;

            inEl.style.left = (seg.start / videoElement.duration * 100) + '%';
            outEl.style.left = (seg.end / videoElement.duration * 100) + '%';

            if (seg.start === 0 && seg.end === 0) {
                inEl.style.display = 'none';
                outEl.style.display = 'none';
            } else {
                inEl.style.display = 'flex';
                outEl.style.display = 'flex';
            }
        }

        function updatePlayhead(time) {
            if (!videoElement.duration) return;
            const pct = (time / videoElement.duration) * 100;
            playhead.style.left = pct + '%';

            if (isPlaying && timelineScrollViewport && timelineTrack) {
                const trackWidth = timelineTrack.getBoundingClientRect().width;
                const playheadPx = (time / videoElement.duration) * trackWidth;
                if (playheadPx > timelineScrollViewport.scrollLeft + timelineScrollViewport.clientWidth - 40) {
                    timelineScrollViewport.scrollLeft = playheadPx - 40;
                } else if (playheadPx < timelineScrollViewport.scrollLeft) {
                    timelineScrollViewport.scrollLeft = Math.max(0, playheadPx - 20);
                }
            }
        }

        videoElement.addEventListener('timeupdate', () => {
            if (!activeHandle) {
                updatePlayhead(videoElement.currentTime);
            }
        });

        // Frame Stepping with Single Tap and Accelerated Long-Press
        function setupFrameButton(btn, direction) {
            let holdTimeout = null;
            let stepInterval = null;
            let holdStartTime = 0;
            let virtualTargetTime = 0;
            const fps = 30;
            const frameDur = 1 / fps; // ~0.0333s

            function stepFrame(multiplier = 1) {
                if (!videoElement.duration) return;
                virtualTargetTime = Math.max(0, Math.min(videoElement.duration, virtualTargetTime + direction * frameDur * multiplier));
                requestSeek(virtualTargetTime);
                updatePlayhead(virtualTargetTime);
            }

            function stopStepping() {
                if (holdTimeout) {
                    clearTimeout(holdTimeout);
                    holdTimeout = null;
                }
                if (stepInterval) {
                    clearInterval(stepInterval);
                    stepInterval = null;
                }
            }

            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                stopStepping();

                virtualTargetTime = videoElement.currentTime;
                stepFrame(1); // Immediate single frame step

                holdStartTime = Date.now();

                // Hold delay: 250ms
                holdTimeout = setTimeout(() => {
                    stepInterval = setInterval(() => {
                        const elapsed = Date.now() - holdStartTime;
                        let multiplier = 1;
                        if (elapsed > 2000) {
                            multiplier = 4; // Fast acceleration
                        } else if (elapsed > 1000) {
                            multiplier = 2; // Moderate acceleration
                        }
                        stepFrame(multiplier);
                    }, 60); // 60ms interval (~16 steps/sec)
                }, 250);
            });

            btn.addEventListener('pointerup', stopStepping);
            btn.addEventListener('pointercancel', stopStepping);
            btn.addEventListener('pointerleave', stopStepping);
            btn.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        setupFrameButton(btnFramePrev, -1);
        setupFrameButton(btnFrameNext, 1);

        // Split
        btnSplit.onclick = () => {
            if (segments.length === 0) return;
            const t = videoElement.currentTime;
            const seg = segments[activeSegmentIndex];
            if (t > seg.start + 0.05 && t < seg.end - 0.05) {
                const oldEnd = seg.end;
                seg.end = t;
                const newSeg = { start: t, end: oldEnd };
                segments.splice(activeSegmentIndex + 1, 0, newSeg);
                activeSegmentIndex++;
                renderTimeline();
            }
        };

        // Delete
        btnDeleteSegment.onclick = () => {
            if (segments.length === 0) return;
            segments.splice(activeSegmentIndex, 1);
            if (segments.length === 0) {
                // Must have at least one segment
                segments.push({ start: 0, end: videoElement.duration });
            }
            activeSegmentIndex = Math.max(0, activeSegmentIndex - 1);
            renderTimeline();
            requestSeek(segments[activeSegmentIndex].start);
        };

        // Play Selection
        btnPlaySelection.onclick = () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                if (segments.length === 0) return;
                const seg = segments[activeSegmentIndex];
                videoElement.currentTime = seg.start;
                videoElement.play();
                isPlaying = true;
                btnPlaySelection.innerText = "Stop";
                checkLoop();
            }
        };

        function checkLoop() {
            if (!isPlaying) return;
            const seg = segments[activeSegmentIndex];
            if (videoElement.currentTime >= seg.end) {
                stopPlayback();
                return;
            }
            playbackLoopId = requestAnimationFrame(checkLoop);
        }

        function stopPlayback() {
            isPlaying = false;
            videoElement.pause();
            if (playbackLoopId !== null) {
                cancelAnimationFrame(playbackLoopId);
                playbackLoopId = null;
            }
            btnPlaySelection.innerText = "Play Selection";
        }

        // --- END TIMELINE LOGIC ---
zoomSlider.oninput = () => {
            updateCropBoxSize();
            enforceBounds();
            updateCropCoords();
        };

        function updateCropBoxSize() {
            const pct = zoomSlider.value / 100;
            currentCropSize = maxCropSize * pct;
            const cssW = (currentCropSize / origW) * 100;
            const cssH = (currentCropSize / origH) * 100;
            cropBox.style.width = cssW + '%';
            cropBox.style.height = cssH + '%';
        }

        let isDragging = false;
        let startX, startY, startLeft, startTop;
        const getClientXY = (e) => e.touches ? [e.touches[0].clientX, e.touches[0].clientY] : [e.clientX, e.clientY];

        const startDrag = (e) => {
            isDragging = true;
            const [cx, cy] = getClientXY(e);
            startX = cx; startY = cy;
            startLeft = parseFloat(cropBox.style.left) || 0;
            startTop = parseFloat(cropBox.style.top) || 0;
            e.preventDefault();
        };

        cropBox.onmousedown = startDrag;
        cropBox.ontouchstart = startDrag;
        window.onmouseup = () => { isDragging = false; };
        window.ontouchend = () => { isDragging = false; };

        const doDrag = (e) => {
            if(!isDragging) return;
            const [cx, cy] = getClientXY(e);
            const containerRect = previewContainer.getBoundingClientRect();
            const dx = (cx - startX) / containerRect.width * 100;
            const dy = (cy - startY) / containerRect.height * 100;
            cropBox.style.left = (startLeft + dx) + '%';
            cropBox.style.top = (startTop + dy) + '%';
            enforceBounds();
            updateCropCoords();
        };

        window.onmousemove = doDrag;
        window.ontouchmove = doDrag;

        function enforceBounds() {
            let left = parseFloat(cropBox.style.left) || 0;
            let top = parseFloat(cropBox.style.top) || 0;
            const w = parseFloat(cropBox.style.width);
            const h = parseFloat(cropBox.style.height);
            if(left < 0) left = 0;
            if(left + w > 100) left = 100 - w;
            if(top < 0) top = 0;
            if(top + h > 100) top = 100 - h;
            cropBox.style.left = left + '%';
            cropBox.style.top = top + '%';
        }

        function updateCropCoords() {
            const leftP = parseFloat(cropBox.style.left) / 100;
            const topP = parseFloat(cropBox.style.top) / 100;
            cropX = Math.round(leftP * origW);
            cropY = Math.round(topP * origH);
        }

        const btnGenerate = document.getElementById('btn-generate');
        const statusMsg = document.getElementById('status-message');

        btnGenerate.onclick = async () => {
            const file = fileInput.files[0];
            if (!file) return;

            btnGenerate.disabled = true;
            statusMsg.innerText = "Rendering fixed-crop video...";
            resultSection.style.display = 'none';
            stopPlayback();

            const fd = new FormData();
            fd.append('video', file);
            fd.append('mode', currentMode);
            fd.append('segments', JSON.stringify(segments));
            fd.append('crop_x', cropX);
            fd.append('crop_y', cropY);
            fd.append('crop_size', Math.round(currentCropSize));
            fd.append('caption_main', document.getElementById('caption-main').value);
            fd.append('font_main', document.getElementById('font-main').value);
            fd.append('caption_main_emoji', document.getElementById('caption-emoji-main').value);
            fd.append('caption_curiosity', document.getElementById('caption-curiosity').value);
            fd.append('font_curiosity', document.getElementById('font-curiosity').value);
            fd.append('caption_curiosity_emoji', document.getElementById('caption-emoji-curiosity').value);
            fd.append('enhance', enhanceEnabled ? 'true' : 'false');
            fd.append('audio_mode', audioMode);
            fd.append('branding', brandingEnabled ? 'true' : 'false');

            try {
                const res = await fetch('/render', { method: 'POST', body: fd });
                if(!res.ok) throw new Error("Render failed");
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('result-video').src = url;
                resultSection.style.display = 'block';

                // Display publishing section directly below video if AI package is available
                if (currentGeneratedPair && (currentGeneratedPair.titles || currentGeneratedPair.description)) {
                    populatePublishingSection(currentGeneratedPair);
                } else {
                    if (publishingSection) publishingSection.style.display = 'none';
                }


                // Scroll to result smoothly
                setTimeout(() => {
                    resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

                document.getElementById('btn-download').onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `shortsai_${currentMode}.mp4`;
                    a.click();
                };
                statusMsg.innerText = ""; // Clear status when done
            } catch(e) {
                statusMsg.innerText = "Error rendering video";
            } finally {
                btnGenerate.disabled = false;
            }
        };
    </script>
